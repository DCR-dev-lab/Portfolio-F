  <rect x="292" y="490" width="190" height="42" rx="10" fill="#1c1917" stroke="#292524"/>
  <text x="387" y="517" text-anchor="middle" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">Node.js &amp; Express</text>

  <rect x="498" y="490" width="150" height="42" rx="10" fill="#1c1917" stroke="#292524"/>
  <text x="573" y="517" text-anchor="middle" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">MongoDB</text>

  <rect x="664" y="490" width="170" height="42" rx="10" fill="#1c1917" stroke="#292524"/>
  <text x="749" y="517" text-anchor="middle" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">Tailwind CSS v4</text>
