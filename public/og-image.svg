<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0c0a09"/>
  <!-- Ambient Red Top Radial Glow -->
  <circle cx="600" cy="0" r="450" fill="#dc2626" fill-opacity="0.18"/>
  <circle cx="950" cy="400" r="300" fill="#dc2626" fill-opacity="0.08"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="#292524" stroke-width="2"/>

  <!-- Terminal Icon Badge -->
  <rect x="96" y="96" width="64" height="64" rx="16" fill="#1c1917" stroke="#292524" stroke-width="2"/>
  <path d="M116 116L128 128L116 140" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 140H144" stroke="#faf8f5" stroke-width="4" stroke-linecap="round"/>

  <!-- Status Pill -->
  <rect x="180" y="108" width="220" height="40" rx="20" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
