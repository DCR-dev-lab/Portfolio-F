  <text x="222" y="133" fill="#a8a29e" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500">Available for projects</text>

  <!-- Main Headline -->
  <text x="96" y="250" fill="#faf8f5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="58" font-weight="800">Denny Charles Raj<tspan fill="#dc2626">.</tspan></text>
  <text x="96" y="315" fill="#e7e5e4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="600">Full Stack Developer &amp; UI Architect</text>

  <!-- Subtitle -->
  <text x="96" y="380" fill="#a8a29e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="400">Crafting resilient architectures, high-performance web systems,</text>
  <text x="96" y="415" fill="#a8a29e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="400">and refined digital products with modern technologies.</text>

  <!-- Tags / Skills Proof Strip -->
  <rect x="96" y="490" width="180" height="42" rx="10" fill="#1c1917" stroke="#292524"/>
